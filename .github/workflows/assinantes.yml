# Integração com o Mercado Pago: a cada 15 minutos lê as assinaturas do plano "Mastigô mensal" e publica
# assinantes.json (só códigos embaralhados dos e-mails e a situação, nunca nome ou e-mail) para o site
# liberar ou bloquear o acesso. O Access Token fica no segredo MP_ACCESS_TOKEN deste repositório
# (Settings › Secrets and variables › Actions) e nunca aparece no código nem nos registros.
# Este arquivo vem de pipoca-pro/scripts/site-github; não edite aqui.
name: Assinaturas do Mercado Pago
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: assinantes
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ler assinaturas no Mercado Pago
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: node .github/assinantes.mjs
      - name: Publicar se mudou
        run: |
          git config user.name "Mastigô"
          git config user.email "actions@users.noreply.github.com"
          git add assinantes.json
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -q -m "Atualiza assinantes"
          git pull -q --rebase && git push -q
